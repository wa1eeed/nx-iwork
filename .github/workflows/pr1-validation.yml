name: PR-1 validation (ActivityEvent + migration chain)

# Real pgvector-backed validation for PR-1 (Phase 0). Proves, from a clean DB:
#  1) the complete Prisma migration chain applies,
#  2) `migrate deploy` succeeds against the existing chain,
#  3) the ActivityEvent integration tests execute (not skip),
#  4) the full test suite is green,
#  5) the committed migration/trigger SQL matches the schema (no drift),
#  6) `migrate diff` reports no drift.
# Triggered on pushes to the PR-1 branch and manually.

on:
  push:
    branches: [release/full-platform]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bznss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bznss_test
      ACTIVITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bznss_test

    steps:
      - name: Checkout PR-1 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: (1)(2) Migrate chain from a clean database
        run: npx prisma migrate deploy

      - name: (6) Drift check — migrate status
        run: npx prisma migrate status

      - name: (5)(6) Drift check — DB matches schema (exit-code)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: (5) Show committed ActivityEvent migration/trigger SQL
        run: cat prisma/migrations/20260926120000_activity_event/migration.sql

      - name: (3)(4) Full test suite incl. ActivityEvent integration tests
        run: npx vitest run --reporter verbose
